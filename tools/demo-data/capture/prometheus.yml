# Prometheus para la captura de docs/images. No es el config de deploy/: este
# raspa los dos exportadores sinteticos de tools/demo-data y fija `instance` a
# nombres inventados, para que ningun panel de la captura pueda mostrar el host
# real de quien la ejecuta. El deploy/prometheus/prometheus.yml del repo queda
# intacto para uso real.
global:
  scrape_interval: 15s

scrape_configs:
  - job_name: ai-usage-exporter
    static_configs:
      - targets: ["host.docker.internal:19477"]
        labels:
          instance: demo-workstation
      - targets: ["host.docker.internal:19478"]
        labels:
          instance: demo-laptop
