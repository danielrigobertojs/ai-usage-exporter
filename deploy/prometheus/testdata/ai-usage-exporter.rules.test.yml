rule_files:
  - ../ai-usage-exporter.rules.yml

evaluation_interval: 1m

tests:
  - name: exporter down alerts for the example job
    interval: 1m
    input_series:
      - series: 'up{instance="host-example-job",job="ai-usage-exporter"}'
        values: '0x10'
    alert_rule_test:
      - eval_time: 9m
        alertname: AIUsageExporterDown
        exp_alerts:
          - exp_labels:
              alertname: AIUsageExporterDown
              instance: host-example-job
              job: ai-usage-exporter
              severity: warning
            exp_annotations:
              summary: AI usage exporter is unreachable
              description: Prometheus has been unable to scrape this exporter for five minutes.

  - name: exporter down alerts for the worker job
    interval: 1m
    input_series:
      - series: 'up{instance="host-worker-job",job="ai-worker"}'
        values: '0x10'
    alert_rule_test:
      - eval_time: 9m
        alertname: AIUsageExporterDown
        exp_alerts:
          - exp_labels:
              alertname: AIUsageExporterDown
              instance: host-worker-job
              job: ai-worker
              severity: warning
            exp_annotations:
              summary: AI usage exporter is unreachable
              description: Prometheus has been unable to scrape this exporter for five minutes.

  - name: unavailable provider that was never installed does not alert
    interval: 1m
    input_series:
      - series: 'ai_usage_provider_available{instance="host-never-installed",tool="codex"}'
        values: '0x30'
    alert_rule_test:
      - eval_time: 29m
        alertname: AIUsageProviderUnavailable
        exp_alerts: []

  - name: provider that becomes unavailable alerts after its for duration
    interval: 1m
    input_series:
      - series: 'ai_usage_provider_available{instance="host-provider-failed",tool="codex"}'
        values: '1x10 0x20'
    alert_rule_test:
      - eval_time: 29m
        alertname: AIUsageProviderUnavailable
        exp_alerts:
          - exp_labels:
              alertname: AIUsageProviderUnavailable
              instance: host-provider-failed
              severity: warning
              tool: codex
            exp_annotations:
              summary: AI usage provider source is unavailable
              description: The provider source has not been readable for ten minutes.

  - name: only the provider that became unavailable alerts on a mixed host
    interval: 1m
    input_series:
      - series: 'ai_usage_provider_available{instance="host-mixed",tool="codex"}'
        values: '1x10 0x20'
      - series: 'ai_usage_provider_available{instance="host-mixed",tool="claude-code"}'
        values: '0x30'
    alert_rule_test:
      - eval_time: 29m
        alertname: AIUsageProviderUnavailable
        exp_alerts:
          - exp_labels:
              alertname: AIUsageProviderUnavailable
              instance: host-mixed
              severity: warning
              tool: codex
            exp_annotations:
              summary: AI usage provider source is unavailable
              description: The provider source has not been readable for ten minutes.
