# Scrapea ai-usage-exporter corriendo en el host, no en un contenedor: el
# binario lee logs locales del usuario (~/.claude, ~/.codex, ~/.local/share/opencode)
# y JCB-316 no depende de la imagen de contenedor de JCB-317.
#
# El exporter reescanea el historial completo cada 60s por defecto. Un scrape
# cada 15s hace visible con poca demora el snapshot renovado y la frescura del
# escaneo, sin asumir que las gauges de ventana son counters.
global:
  scrape_interval: 15s

scrape_configs:
  - job_name: ai-usage-exporter
    static_configs:
      - targets: ["host.docker.internal:9477"]
